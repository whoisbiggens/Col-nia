<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cologne Memory</title>
<style>
  :root{
    --red:#c8102e; --red-dark:#8f0b20; --paper:#fffaf2; --ink:#2a1a1a;
    --sky:#bfe3f5; --sun:#ffd23f; --green:#2e9e6b;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(var(--sky) 0 60%, #e8f4e1 60%);
    min-height:100vh; padding:16px;
  }
  .wrap{max-width:900px;margin:0 auto}
  h1{
    margin:4px 0 2px; text-align:center; font-size:clamp(28px,6vw,48px);
    color:var(--red); letter-spacing:.5px; text-shadow:0 3px 0 #fff;
  }
  .sub{text-align:center;margin:0 0 14px;font-size:clamp(15px,3vw,19px)}
  .bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin-bottom:16px}
  .bar button,.overlay button{
    font:inherit;font-weight:700;font-size:17px;cursor:pointer;
    border:3px solid var(--red);background:#fff;color:var(--red);
    padding:8px 16px;border-radius:999px;min-height:44px;
  }
  .bar button[aria-pressed="true"]{background:var(--red);color:#fff}
  .bar button:hover{background:var(--sun);color:var(--ink);border-color:var(--ink)}
  .stat{font-weight:700;font-size:18px;background:#fff;border-radius:999px;padding:8px 16px;border:3px solid var(--ink);min-height:44px}
  button:focus-visible,.card:focus-visible{outline:4px solid var(--ink);outline-offset:3px}

  .board{display:flex;flex-wrap:wrap;gap:clamp(8px,2vw,16px);justify-content:center}
  .card{
    --w:calc((100% - 3*clamp(8px,2vw,16px))/4);
    width:min(var(--w),170px); aspect-ratio:1; padding:0; border:0; background:none;
    perspective:700px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  @media (min-width:700px){ .card{--w:calc((100% - 4*16px)/5)} }
  .inner{
    position:relative;width:100%;height:100%;transform-style:preserve-3d;
    transition:transform .45s;
  }
  .card.open .inner,.card.done .inner{transform:rotateY(180deg)}
  .face{
    position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:16px;overflow:hidden;border:4px solid #fff;
    box-shadow:0 5px 0 rgba(0,0,0,.25);
  }
  .back{
    background:var(--red);
    display:flex;align-items:center;justify-content:center;
  }
  .back svg{width:70%;height:70%}
  .front{transform:rotateY(180deg);background:#fff}
  .front img{width:100%;height:100%;object-fit:cover;display:block}
  .front span{
    position:absolute;left:0;right:0;bottom:0;padding:4px 6px;text-align:center;
    font-weight:700;font-size:clamp(11px,2.2vw,15px);background:rgba(255,255,255,.92);
  }
  .card.done .front{border-color:var(--green)}
  .card.done .inner{animation:pop .5s .45s}
  @keyframes pop{0%,100%{scale:1}50%{scale:1.08}}

  .overlay{
    position:fixed;inset:0;background:rgba(42,26,26,.6);display:none;
    align-items:center;justify-content:center;padding:20px;z-index:10;
  }
  .overlay.show{display:flex}
  .box{background:var(--paper);border:5px solid var(--red);border-radius:24px;padding:28px;text-align:center;max-width:380px;animation:rise .5s}
  .box h2{margin:0 0 8px;font-size:34px;color:var(--red)}
  .box p{font-size:20px;margin:0 0 18px}
  .box .stars{font-size:44px;letter-spacing:6px}
  @keyframes rise{from{transform:translateY(40px) scale(.9);opacity:0}}
  @media (prefers-reduced-motion:reduce){
    .inner{transition:none}
    .card.done .inner,.box{animation:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Cologne Memory</h1>
  <p class="sub">Find the matching pairs!</p>
  <div class="bar">
    <div id="levels" role="group" aria-label="Number of pairs"></div>
    <div class="stat" aria-live="polite">Moves: <span id="moves">0</span></div>
    <button id="restart" type="button">New game</button>
  </div>
  <div class="board" id="board"></div>
</div>

<div class="overlay" id="win" role="dialog" aria-modal="true" aria-labelledby="winTitle">
  <div class="box">
    <div class="stars" aria-hidden="true">★★★</div>
    <h2 id="winTitle">Well done!</h2>
    <p>You found all pairs in <strong id="finalMoves">0</strong> moves.</p>
    <button id="again" type="button">Play again</button>
  </div>
</div>

<script>
/* ---------- EDIT HERE: add or change pictures ----------
   Each entry = one pair of cards. Put the image file in the same folder as this index.html. */
const PICTURES = [
  { src: "koelner-dom.jpg",          label: "Cologne Cathedral" },
  { src: "kranhaus.jpg",             label: "Crane House" },
  { src: "hohenzollernbruecke.jpg",  label: "Hohenzollern Bridge" },
  { src: "schokoladenmuseum.jpg",    label: "Chocolate Museum" },
  { src: "heumarkt.jpg",             label: "Heumarkt" }
];
/* ------------------------------------------------------- */

const board = document.getElementById("board");
const movesEl = document.getElementById("moves");
const levelsEl = document.getElementById("levels");
const winEl = document.getElementById("win");
let pairs = Math.min(4, PICTURES.length), first = null, lock = false, moves = 0, found = 0;

const BACK_SVG = `<svg viewBox="0 0 100 100" aria-hidden="true">
  <g fill="#ffd23f" stroke="#fff" stroke-width="3" stroke-linejoin="round">
    <path d="M10 40 L10 18 L24 28 L35 12 L46 28 L60 18 L60 40 Z" transform="translate(20 4)"/>
    <path d="M10 40 L10 18 L24 28 L35 12 L46 28 L60 18 L60 40 Z" transform="translate(-2 48) scale(.8)"/>
    <path d="M10 40 L10 18 L24 28 L35 12 L46 28 L60 18 L60 40 Z" transform="translate(54 48) scale(.8)"/>
  </g></svg>`;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function buildLevels(){
  levelsEl.innerHTML = "";
  for(let n=3;n<=PICTURES.length;n++){
    const b=document.createElement("button");
    b.type="button"; b.textContent=n+" pairs";
    b.setAttribute("aria-pressed", n===pairs);
    b.addEventListener("click",()=>{pairs=n;buildLevels();start();});
    levelsEl.appendChild(b); levelsEl.appendChild(document.createTextNode(" "));
  }
}

function start(){
  winEl.classList.remove("show");
  board.innerHTML=""; first=null; lock=false; moves=0; found=0; movesEl.textContent=0;
  const chosen = shuffle(PICTURES.slice()).slice(0,pairs);
  const deck = shuffle(chosen.flatMap(p=>[p,p]));
  deck.forEach(p=>{
    const c=document.createElement("button");
    c.type="button"; c.className="card"; c.dataset.id=p.src;
    c.setAttribute("aria-label","Hidden card");
    c.innerHTML=`<div class="inner">
      <div class="face back">${BACK_SVG}</div>
      <div class="face front"><img src="${p.src}" alt="${p.label}"><span>${p.label}</span></div>
    </div>`;
    c.addEventListener("click",()=>flip(c));
    board.appendChild(c);
  });
}

function flip(c){
  if(lock||c.classList.contains("open")||c.classList.contains("done")) return;
  c.classList.add("open");
  c.setAttribute("aria-label", c.querySelector("img").alt);
  if(!first){first=c;return;}
  moves++; movesEl.textContent=moves;
  if(first.dataset.id===c.dataset.id){
    [first,c].forEach(x=>{x.classList.remove("open");x.classList.add("done");});
    first=null; found++;
    if(found===pairs) setTimeout(()=>{
      document.getElementById("finalMoves").textContent=moves;
      winEl.classList.add("show"); document.getElementById("again").focus();
    },1000);
  }else{
    lock=true; const a=first; first=null;
    setTimeout(()=>{
      [a,c].forEach(x=>{x.classList.remove("open");x.setAttribute("aria-label","Hidden card");});
      lock=false;
    },1100);
  }
}

document.getElementById("restart").addEventListener("click",start);
document.getElementById("again").addEventListener("click",start);
buildLevels(); start();
</script>
</body>
</html>
